// TETOS & LASTSEEN
function loadLocal(){
  try{tetos=JSON.parse(localStorage.getItem('nfkr-tetos'))||{};}catch{tetos={};}
  try{lastSeen=JSON.parse(localStorage.getItem('nfkr-lastseen'))||{};}catch{lastSeen={};}
}
function saveTetosLocal(){localStorage.setItem('nfkr-tetos',JSON.stringify(tetos));}
function saveLastSeen(tab){lastSeen[tab]=new Date().toISOString();localStorage.setItem('nfkr-lastseen',JSON.stringify(lastSeen));}
function getNewCount(items,tab){
  const last=lastSeen[tab];if(!last)return 0;
  return items.filter(i=>i.adicionadoEm>last&&i.adicionadoPor&&i.adicionadoPor!==(currentUser?.displayName||currentUser?.email)).length;
}
function updateBadges(){
  const defs=[{tab:'financas',items:[...fixedExpenses,...incomes]},{tab:'planilha',items:recibos}];
  const tabOrder=['dashboard','meses','scanner','planilha','financas','tetos'];
  defs.forEach(({tab,items})=>{
    const idx=tabOrder.indexOf(tab);
    const el=document.querySelectorAll('.tab')[idx];
    if(!el)return;
    const old=el.querySelector('.badge');if(old)old.remove();
    const c=getNewCount(items,tab);
    if(c>0){const b=document.createElement('span');b.className='badge';b.textContent=c;el.appendChild(b);}
  });
}

    document.getElementById('loginScreen').style.display='none';

    document.getElementById('userAvatar').textContent=user.displayName?.[0]||'?';

  }else{
    currentUser=null;
    document.getElementById('loginScreen').style.display='block';
    document.getElementById('appScreen').style.display='none';
    [unsubR,unsubF,unsubI].forEach(u=>u&&u());
  }
});

function startListeners(){
  if(!uid())return;
  unsubR=onSnapshot(collection(db,`users/${uid()}/recibos`),s=>{
    recibos=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.data>a.data?1:-1);
    renderAll();setSyncing(false);
  });
  unsubF=onSnapshot(collection(db,`users/${uid()}/fixedExpenses`),s=>{
    fixedExpenses=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.data>a.data?1:-1);
    renderAll();
  });
  unsubI=onSnapshot(collection(db,`users/${uid()}/incomes`),s=>{
    incomes=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.data>a.data?1:-1);
    renderAll();
  });
}

// TABS
window.switchTab=(tab)=>{
  ['dashboard','meses','scanner','planilha','financas','tetos'].forEach((t,i)=>{

// MONTH FILTER
function updateMonthFilter(){
  const all=[...new Set([...recibos,...fixedExpenses,...incomes].map(r=>r.data?.slice(0,7)).filter(Boolean))].filter(m=>m>='2026-01').sort().reverse();
  const sel=document.getElementById('filterMonth');
  const cur=sel.value||filterMonth||new Date().toISOString().slice(0,7);
  sel.innerHTML=all.map(m=>`<option value="${m}" ${m===cur?'selected':''}>${monthLabel(m)}</option>`).join('');
  if(!sel.value&&all.length)sel.value=all[0];
  filterMonth=sel.value;
  const lbl=document.getElementById('monthLabel');
  if(lbl)lbl.textContent=filterMonth?'✅ '+monthLabel(filterMonth):'';
}

    document.getElementById('monthUpdating').style.display='none';
    document.getElementById('monthLabel').style.display='block';
    document.getElementById('monthLabel').textContent='✅ '+monthLabel(filterMonth);

};

function getFiltered(){

}

// IMAGE COMPRESSION
function compressImage(file,maxW=1200,q=0.75){
  return new Promise(res=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        canvas.toBlob(blob=>{
          const r2=new FileReader();
          r2.onload=e2=>res(e2.target.result.split(',')[1]);
          r2.readAsDataURL(blob);
        },'image/jpeg',q);
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleFile(this.files[0])">
    <div id="scanError" style="display:none;background:#450A0A;border:1px solid #7F1D1D;border-radius:10px;padding:12px;color:#FCA5A5;font-size:13px;margin-bottom:14px"></div>
  `;
  const dz=document.getElementById('dropZone');
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.style.borderColor='#6366F1';});
  dz.addEventListener('dragleave',()=>dz.style.borderColor='#334155');
  dz.addEventListener('drop',e=>{e.preventDefault();dz.style.borderColor='#334155';handleFile(e.dataTransfer.files[0]);});
}

window.handleFile=async(file)=>{
  if(!file||!file.type.startsWith('image/'))return;
  document.getElementById('scanContent').style.display='none';
  document.getElementById('loadContent').style.display='block';
  document.getElementById('scanError').style.display='none';
  try{
    document.getElementById('loadStatus').textContent='Comprimindo imagem...';
    const b64=await compressImage(file);
    document.getElementById('loadStatus').textContent='Analisando com IA...';
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':ANTHROPIC_KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2000,messages:[{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
        {type:'text',text:`Analise este recibo. Responda APENAS com JSON válido sem markdown.\n{"estabelecimento":"nome","data":"YYYY-MM-DD","valor":0.00,"categoria":"Alimentação","descricao":"resumo","subcategorias":[{"nome":"Açougue","itens":["item"],"valor":0.00}]}\nSubcategorias: Açougue, Bebidas, Frutas e Verduras, Laticínios, Padaria, Limpeza, Higiene, Congelados, Grãos e Cereais, Outros.\nData: ${new Date().toISOString().split('T')[0]}`}
      ]}]})
    });
    const json=await res.json();
    if(json.error)throw new Error(json.error.message);
    const data=JSON.parse(json.content.map(b=>b.text||'').join('').replace(/```json|```/g,'').trim());
    setSyncing(true);
    const novo={estabelecimento:data.estabelecimento||'Não identificado',data:data.data||new Date().toISOString().split('T')[0],valor:data.valor||0,categoria:data.categoria||'Outros',descricao:data.descricao||'',subcategorias:data.subcategorias||[],adicionadoEm:new Date().toISOString(),syncedSheets:false,adicionadoPor:currentUser.displayName||currentUser.email};
    const ref=await addDoc(collection(db,`users/${uid()}/recibos`),novo);
    showToast('✅ Recibo salvo e sincronizado!');
    try{
      await fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({...novo,id:ref.id})});
      await setDoc(doc(db,`users/${uid()}/recibos`,ref.id),{syncedSheets:true},{merge:true});
    }catch{}
    switchTab('planilha');
  }catch(err){
    document.getElementById('scanError').style.display='block';
    document.getElementById('scanError').textContent='⚠️ '+err.message+'. Tente com melhor iluminação.';
  }finally{
    document.getElementById('scanContent').style.display='block';
    document.getElementById('loadContent').style.display='none';
  }
};

// DASHBOARD
function renderCategoryCards(ffList, totalI){
  // Group by category section
  const catTotals = {};
  FINANCE_SECTIONS.forEach(sec => {
    const total = ffList.filter(f => sec.cats.includes(f.categoria)).reduce((s,f)=>s+(f.valor||0),0);
    if(total > 0) catTotals[sec.label] = { total, color: sec.color, key: sec.key };
  });
  const entries = Object.entries(catTotals).sort((a,b)=>b[1].total-a[1].total);
  if(!entries.length) return '';
  const maxVal = Math.max(...entries.map(([,v])=>v.total), 1);

  return `<div class="section-box">
    <div style="font-weight:700;font-size:13px;color:#F1F5F9;margin-bottom:14px">📊 Gastos por categoria</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
      ${entries.map(([label,{total,color}])=>{
        const pct = totalI > 0 ? Math.min((total/totalI)*100,100) : 0;
        return`<div style="background:#0F172A;border-radius:12px;padding:12px;border:1px solid #1E293B">
          <div style="font-size:11px;font-weight:700;color:${color};margin-bottom:6px">${label}</div>
          <div style="font-size:16px;font-weight:800;color:#F1F5F9;margin-bottom:6px">${fmt(total)}</div>
          <div style="background:#1E293B;border-radius:99px;height:6px;overflow:hidden;margin-bottom:4px">
            <div style="height:100%;border-radius:99px;background:${color};width:${(total/maxVal)*100}%;transition:width 0.5s"></div>
          </div>
          <div style="font-size:10px;color:#64748B">${totalI>0?pct.toFixed(1)+'% da renda':'—'}</div>
        </div>`;
      }).join('')}
    </div>
    <!-- Bar chart -->
    <div style="overflow-x:auto">
      <div style="min-width:${Math.max(280, entries.length*52)}px">
        <div style="display:flex;align-items:flex-end;gap:6px;height:100px;padding:0 4px">
          ${entries.map(([label,{total,color}])=>{
            const h = Math.round((total/maxVal)*88);
            const shortLabel = label.split(' ').slice(1).join(' ').slice(0,8);
            return`<div style="display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:42px">
              <div style="font-size:9px;color:${color};font-weight:700">${total>=1000?(total/1000).toFixed(1)+'k':total.toFixed(0)}</div>
              <div style="width:100%;background:${color};border-radius:4px 4px 0 0;height:${h}px;min-height:3px;opacity:0.9"></div>
              <div style="font-size:9px;color:#64748B;text-align:center;line-height:1.2;max-width:42px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${shortLabel}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

function calcMonth(ym){
  const r=recibos.filter(x=>x.data?.startsWith(ym)).reduce((s,x)=>s+(x.valor||0),0);
  const f=fixedExpenses.filter(x=>x.data?.startsWith(ym)).reduce((s,x)=>s+(x.valor||0),0);
  const i=incomes.filter(x=>x.data?.startsWith(ym)).reduce((s,x)=>s+(x.valorReal||x.valor||0),0);
  return{r,f,i,saldo:i-r-f};
}

function renderBarChartHTML(monthlyData){
  const months=[...monthlyData].reverse();
  const maxVal=Math.max(...months.map(m=>Math.max(m.i,m.r+m.f)),1);
  return`<div style="overflow-x:auto"><div style="min-width:${Math.max(300,months.length*60)}px">
    <div style="display:flex;gap:6px;margin-bottom:8px"><span style="font-size:10px;color:#34D399">■ Entradas</span><span style="font-size:10px;color:#EF4444">■ Gastos</span><span style="font-size:10px;color:#6366F1">■ Saldo</span></div>
    <div style="display:flex;align-items:flex-end;gap:6px;height:120px">
      ${months.map(m=>{
        const hI=Math.round((m.i/maxVal)*100);
        const hG=Math.round(((m.r+m.f)/maxVal)*100);
        const hS=Math.abs(Math.round((m.saldo/maxVal)*100));
        const pos=m.saldo>=0;
        const label=monthLabel(m.ym).split(' ')[0].slice(0,3).toUpperCase();
        return`<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:40px">
          <div style="font-size:9px;color:${pos?'#34D399':'#EF4444'};font-weight:700">${pos?'+':''}${m.saldo>=1000?(m.saldo/1000).toFixed(1)+'k':m.saldo.toFixed(0)}</div>

            <div style="width:10px;background:#34D399;border-radius:3px 3px 0 0;height:${hI}px;min-height:2px"></div>
            <div style="width:10px;background:#EF4444;border-radius:3px 3px 0 0;height:${hG}px;min-height:2px"></div>

        </div>`;
      }).join('')}
    </div>
  </div></div>`;
}

window.syncRecibo=async(id)=>{

function getGastoCategoria(cat,fm){
  const gf=fixedExpenses.filter(f=>f.categoria===cat&&(!fm||f.data?.startsWith(fm))).reduce((s,f)=>s+(f.valor||0),0);
  const gm=recibos.filter(r=>!fm||r.data?.startsWith(fm)).reduce((s,r)=>s+(r.subcategorias||[]).filter(sub=>sub.nome===cat).reduce((ss,sub)=>ss+(sub.valor||0),0),0);
  const gi=incomes.filter(i=>i.categoria===cat&&(!fm||i.data?.startsWith(fm))).reduce((s,i)=>s+(i.valorReal||i.valor||0),0);
  return gf+gm+gi;
}

window.removerDuplicatas=async()=>{
  // First show preview of duplicates found
  const dupsI=findDups(incomes, i=>`${i.descricao?.trim().toLowerCase()}|${i.valor}|${i.data}`);
  const dupsF=findDups(fixedExpenses, f=>`${f.descricao?.trim().toLowerCase()}|${f.valor}|${f.data}`);
  const dupsR=findDups(recibos, r=>`${r.estabelecimento?.trim().toLowerCase()}|${r.valor}|${r.data}`);

  // Also find similar (same value + same month, slightly different name)
  const simI=findSimilar(incomes);
  const simF=findSimilar(fixedExpenses);

  const totalDups=dupsI.length+dupsF.length+dupsR.length;
  const totalSim=simI.length+simF.length;

  if(totalDups===0&&totalSim===0){
    showToast('✅ Nenhuma duplicata encontrada!');
    return;
  }

  // Show preview modal
  const ex=document.getElementById('modalOverlay');if(ex)ex.remove();
  const overlay=document.createElement('div');
  overlay.id='modalOverlay';overlay.className='modal-overlay';
  overlay.innerHTML=`<div class="modal-box">
    <div class="modal-title" style="color:#F59E0B">🧹 Duplicatas encontradas</div>

    ${totalDups>0?`
    <div style="background:#450A0A;border:1px solid #7F1D1D;border-radius:10px;padding:12px;margin-bottom:12px">
      <div style="font-size:12px;font-weight:700;color:#EF4444;margin-bottom:8px">🚨 ${totalDups} duplicata${totalDups>1?'s':''} exata${totalDups>1?'s':''} (mesmo nome + valor + data)</div>
      ${[...dupsI,...dupsF,...dupsR].slice(0,6).map(d=>`<div style="font-size:11px;color:#FCA5A5;margin-bottom:3px">• ${d.descricao||d.estabelecimento} — ${fmt(d.valor)} — ${fmtDate(d.data)}</div>`).join('')}
      ${totalDups>6?`<div style="font-size:11px;color:#64748B">... e mais ${totalDups-6}</div>`:''}
    </div>`:''}

    ${totalSim>0?`
    <div style="background:#451A03;border:1px solid #92400E;border-radius:10px;padding:12px;margin-bottom:12px">
      <div style="font-size:12px;font-weight:700;color:#F59E0B;margin-bottom:8px">⚠️ ${totalSim} lançamento${totalSim>1?'s':''} similares (mesmo valor no mesmo mês)</div>
      ${[...simI,...simF].slice(0,4).map(d=>`<div style="font-size:11px;color:#FCD34D;margin-bottom:3px">• ${d.descricao} — ${fmt(d.valor)} — ${fmtDate(d.data)}</div>`).join('')}
      ${totalSim>4?`<div style="font-size:11px;color:#64748B">... e mais ${totalSim-4}</div>`:''}
    </div>`:''}

    <div style="font-size:12px;color:#64748B;margin-bottom:16px">As duplicatas exatas serão removidas automaticamente. Os similares você decide.</div>

    <div style="display:flex;gap:10px">
      <button onclick="window.confirmarRemocao(${JSON.stringify([...dupsI.map(d=>({id:d.id,col:'incomes'})),...dupsF.map(d=>({id:d.id,col:'fixedExpenses'})),...dupsR.map(d=>({id:d.id,col:'recibos'}))]}.replace(/'/g,\"\"))" class="btn-save" style="background:linear-gradient(135deg,#D97706,#F59E0B)">🗑️ Remover ${totalDups} duplicata${totalDups>1?'s':''}</button>
      <button onclick="document.getElementById('modalOverlay').remove()" class="btn-cancel">Cancelar</button>
    </div>
  </div>`;
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.body.appendChild(overlay);
};

function findDups(items, keyFn){
  const seen={}, dups=[];
  // Sort by adicionadoEm to keep oldest
  const sorted=[...items].sort((a,b)=>(a.adicionadoEm||'')>(b.adicionadoEm||'')?1:-1);
  sorted.forEach(item=>{
    const key=keyFn(item);
    if(seen[key]) dups.push(item);
    else seen[key]=true;
  });
  return dups;
}

function findSimilar(items){
  const sim=[];
  const byMonth={};
  items.forEach(item=>{
    const month=item.data?.slice(0,7);
    const key=`${month}|${item.valor}`;
    if(!byMonth[key]) byMonth[key]=[];
    byMonth[key].push(item);
  });
  Object.values(byMonth).forEach(group=>{
    if(group.length>1){
      // Check if names are different (not exact dup)
      const names=[...new Set(group.map(g=>g.descricao?.trim().toLowerCase()))];
      if(names.length>1) group.slice(1).forEach(g=>sim.push(g));
    }
  });
  return sim;
}

};

  for(const g of gastos)await addDoc(collection(db,`users/${uid()}/fixedExpenses`),{...g,adicionadoEm:new Date().toISOString(),adicionadoPor:por});
  showToast(`✅ ${entradas.length} entradas e ${gastos.length} gastos importados!`);
};

</script>
</body>
</html>
